<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路口安全 AI 離線辨識系統 — 學員入口</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #1e3c72; --secondary-blue: #2a5298; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f6f9; }
        .navbar-custom { background-color: var(--primary-blue); }
        .hero-banner {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            color: white; padding: 60px 20px 50px;
        }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">🚦 路口安全 AI 離線辨識系統</a>
            <div class="ms-auto">
                <a class="btn btn-outline-warning btn-sm fw-bold" href="teach.html">📖 操作教學手冊</a>
            </div>
        </div>
    </nav>

    <!-- 主視覺 -->
    <div class="hero-banner text-center mb-5">
        <div class="container">
            <span class="badge bg-warning text-dark px-3 py-2 mb-3 fw-bold">Edge AI 實務工作坊</span>
            <h1 class="display-5 fw-bold mb-3">🚦 紅綠燈與斑馬線 AI 離線辨識系統</h1>
            <p class="lead mx-auto" style="max-width: 720px; color: #e2e8f0;">
                結合 YOLO26 物件偵測與靜態幾何規則引擎，純瀏覽器端離線推論。請輸入工作坊通關帳密進入系統測試區。
            </p>
        </div>
    </div>

    <!-- 登入驗證卡片 -->
    <div class="container mb-5">
        <div class="card card-custom p-4 mx-auto bg-white" style="max-width: 440px;">
            <h4 class="fw-bold text-center text-primary mb-3">🔐 學員系統登入</h4>
            <p class="text-muted small text-center mb-4">為保護模型權重資源，請輸入課堂提供的帳號與密碼</p>
            
            <div class="mb-3">
                <label class="form-label fw-bold small">學員帳號</label>
                <input type="text" id="userInput" class="form-control" placeholder="例如：student">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">通關密碼</label>
                <input type="password" id="passInput" class="form-control" placeholder="請輸入密碼（如 workshop2026）" onkeyup="if(event.key==='Enter') enterSystem()">
            </div>
            
            <button class="btn btn-primary w-100 fw-bold py-2" onclick="enterSystem()">驗證並進入辨識系統 🚀</button>
            <div id="loginMsg" class="text-danger small text-center mt-2 fw-bold"></div>
        </div>
    </div>

    <script>
        function enterSystem() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();

            if (!user || !pass) {
                document.getElementById('loginMsg').innerText = "⚠️ 請完整輸入帳號與通關密碼！";
                return;
            }

            // 直接把輸入的密碼當作資料夾路徑跳轉，首頁原始碼完全不會暴露模型路徑
            window.location.href = `./${pass}/system.html`;
        }
    </script>
</body>
</html>
